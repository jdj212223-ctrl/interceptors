mod_group_id=com.interceptors
mod_authors=jdj212223-ctrl
mod_description=Storm chasing for ProtoManly's Weather: drive armored tornado interceptors and a gaming camper van, drop the anchors, and track the storm on your screens.

# ProtoManly's Weather is closed source, so it is never committed: we compile against a private copy in libs/
# (gitignored). Updating PMWeather in the game doesn't break the build; copy the new jar here to build against it.
pmweather_jar=libs/pmweather-1.21.1-0.17.16-alpha.jar

# MCEF is optional (the Web app's real browser). Compile-only, private copy in libs/ like PMWeather.
mcef_jar=libs/mcef-neoforge-2.1.6-1.21.1.jar

# Simple Voice Chat is optional (wind distortion on voices). Compile-only, private copy in libs/.
voicechat_jar=libs/voicechat-neoforge-1.21.1-2.6.26.jar
