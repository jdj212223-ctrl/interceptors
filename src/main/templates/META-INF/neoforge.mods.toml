modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# The storms we chase.
[[dependencies.${mod_id}]]
modId="pmweather"
type="required"
versionRange="[0.17.13,)"
ordering="AFTER"
side="BOTH"

# A real web browser in the Web app (live radar sites, YouTube) when MCEF is installed.
[[dependencies.${mod_id}]]
modId="mcef"
type="optional"
versionRange="[2.1,)"
ordering="NONE"
side="CLIENT"

# Voices crackle and break up in tornado wind when Simple Voice Chat is installed.
[[dependencies.${mod_id}]]
modId="voicechat"
type="optional"
versionRange="[2.5,)"
ordering="NONE"
side="BOTH"
